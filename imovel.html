<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0b0b0a">
  <title>Imóvel | ANUBIS Imóveis</title>
  <meta name="description" content="Fotos e informações de imóveis da ANUBIS Imóveis em Corupá/SC.">
  <link rel="icon" href="assets/images/logo-anubis-original.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="styles/property.css">
  <style>
    .property-layout{grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr)}
    .property-main-image{cursor:zoom-in}
    .gallery-caption{color:#a8a39a;font-size:11px;margin:8px 0 0}
    .property-description{white-space:pre-line}
    .photo-placeholder{min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(circle,#262319,#11110e 70%);border:1px solid rgba(201,164,92,.25);color:#e4c783;font:600 25px Georgia,serif;letter-spacing:.18em}
    .photo-placeholder small{font:11px Arial,sans-serif;color:#aaa49a;letter-spacing:.12em}
    .load-error{max-width:760px;margin:45px auto;padding:24px;border:1px solid rgba(201,164,92,.25);color:#d9d1c3;background:#151511}
    @media(max-width:800px){.property-layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="ANUBIS Imóveis - homepage">
      <img src="assets/images/logo-anubis-original.jpeg" alt="Logotipo ANUBIS" class="brand-logo">
      <span class="brand-text"><strong>ANUBIS</strong><small>IMÓVEIS · CORUPÁ/SC</small></span>
    </a>
    <a class="back-link" href="index.html">Homepage ANUBIS ↗</a>
  </header>
  <main class="wrap">
    <div id="property-view" aria-live="polite"></div>
  </main>
  <footer class="site-footer">
    <a class="footer-brand" href="index.html">ANUBIS<span> IMÓVEIS</span></a>
    <p>Locação residencial · Corupá, Santa Catarina</p>
    <a href="https://wa.me/5547992024656" target="_blank" rel="noopener noreferrer">Contato ↗</a>
    <small>© <span id="year"></span> ANUBIS Imóveis</small>
  </footer>
<script>
(() => {
  'use strict';
  const WHATSAPP='5547992024656';
  const host=document.getElementById('property-view');
  document.getElementById('year').textContent=new Date().getFullYear();
  const params=new URLSearchParams(location.search);
  const wantedSlug=params.get('slug')||'';
  const slugify=value=>String(value||'imovel').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'imovel';
  const money=value=>{
    const n=typeof value==='number'?value:Number(value);
    return Number.isFinite(n)?new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n)+'/mês':'Valor a confirmar';
  };
  const node=(tag,cls,text)=>{
    const el=document.createElement(tag);
    if(cls)el.className=cls;
    if(text!==undefined&&text!==null)el.textContent=String(text);
    return el;
  };
  const statusText={available:'Disponível',soon:'Em breve',rented:'Alugado',unavailable:'Indisponível',draft:'Em preparação'};
  const normalizeGallery=p=>{
    const items=Array.isArray(p.gallery)?p.gallery:[];
    const gallery=items.map((item,i)=>typeof item==='string'?{src:item,alt:'Foto '+(i+1)}:{src:item?.src||'',alt:item?.alt||'Foto '+(i+1)}).filter(x=>x.src);
    if(!gallery.length&&p.image)gallery.push({src:p.image,alt:'Foto de '+(p.title||'imóvel')});
    return gallery;
  };
  const safeImagePath=src=>{
    const value=String(src||'');
    if(/^(data:|https?:|blob:)/i.test(value))return value;
    return value.replace(/^(\.\.\/)+/,'').replace(/^\//,'');
  };
  function showError(message){
    host.innerHTML='';
    const box=node('section','load-error');
    box.append(node('h1','', 'Não foi possível abrir este imóvel'));
    box.append(node('p','',message));
    const back=node('a','contact-button','Voltar para a ANUBIS');back.href='index.html';box.append(back);
    host.append(box);
  }
  function render(p){
    document.title=(p.title||'Imóvel')+' | ANUBIS Imóveis';
    const layout=node('div','property-layout');
    const media=node('section','property-media');
    media.setAttribute('aria-label','Fotos de '+(p.title||'imóvel'));
    const gallery=normalizeGallery(p);
    if(gallery.length){
      const main=node('img','property-main-image');
      main.id='main-photo';main.src=safeImagePath(gallery[0].src);main.alt=gallery[0].alt||'Foto do imóvel';main.loading='eager';main.decoding='async';
      media.append(main);
      if(gallery.length>1){
        const thumbs=node('div','property-gallery');thumbs.setAttribute('aria-label','Selecionar foto');
        gallery.forEach((photo,index)=>{
          const button=node('button','property-thumb'+(index===0?' is-active':''));button.type='button';button.setAttribute('aria-label','Ver foto '+(index+1));
          const image=node('img');image.src=safeImagePath(photo.src);image.alt=photo.alt||'Foto '+(index+1);image.loading='lazy';image.decoding='async';button.append(image);
          button.addEventListener('click',()=>{main.src=safeImagePath(photo.src);main.alt=photo.alt||'Foto do imóvel';thumbs.querySelectorAll('button').forEach((item,i)=>item.classList.toggle('is-active',i===index));});
          thumbs.append(button);
        });
        media.append(thumbs);media.append(node('p','gallery-caption','Selecione uma miniatura para ver outra foto.'));
      }
      main.addEventListener('error',()=>{main.alt='Foto indisponível';});
    }else{
      const placeholder=node('div','photo-placeholder');placeholder.append(node('span','','ANUBIS'));placeholder.append(node('small','','FOTOS EM PREPARAÇÃO'));media.append(placeholder);
    }
    const details=node('section','property-details');
    details.append(node('p','eyebrow','ANUBIS IMÓVEIS · CORUPÁ/SC'));
    let badge=p.badge||statusText[p.status]||'Imóvel';
    if(p.status==='available'&&/alugad/i.test(String(badge)))badge='Disponibilidade a confirmar';
    details.append(node('span','property-status status-'+(p.status||'draft'),badge));
    details.append(node('h1','',p.title||'Imóvel para locação'));
    if(p.neighborhood)details.append(node('p','property-location',p.neighborhood));
    details.append(node('p','property-price',money(p.price)));
    const facts=node('div','property-facts');
    if(p.bedrooms!==null&&p.bedrooms!==undefined&&p.bedrooms!=='')facts.append(node('span','',p.bedrooms+' quarto(s)'));
    if(p.bathrooms!==null&&p.bathrooms!==undefined&&p.bathrooms!=='')facts.append(node('span','',p.bathrooms+' banheiro(s)'));
    if(p.area)facts.append(node('span','',String(p.area).replace(/\s*m2\b/i,' m²')));
    details.append(facts);
    if(p.features)details.append(node('p','property-features',p.features));
    if(p.description)details.append(node('p','property-description',p.description));
    const available=p.status==='available'&&!/alugad/i.test(String(p.badge||''));
    if(available){
      const message='Olá! Gostaria de saber mais informações sobre '+(p.title||'este imóvel')+'. Poderia me passar os detalhes e as condições de locação?';
      const contact=node('a','contact-button','Consultar este imóvel pelo WhatsApp ↗');contact.href='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(message);contact.target='_blank';contact.rel='noopener noreferrer';details.append(contact);
    }else{
      details.append(node('p','status-note','Este imóvel não está marcado como disponível para nova locação no cadastro atual.'));
    }
    layout.append(media,details);host.replaceChildren(layout);
  }
  if(!wantedSlug){showError('O link não informou qual imóvel deve ser exibido. Peça à ANUBIS o link individual do anúncio.');return;}
  fetch('imoveis.json',{cache:'no-cache'})
    .then(response=>{if(!response.ok)throw new Error('Não foi possível carregar o catálogo de imóveis.');return response.json();})
    .then(items=>{
      if(!Array.isArray(items))throw new Error('O catálogo de imóveis está em um formato inválido.');
      const property=items.find(item=>(item.slug||slugify(item.title))===wantedSlug);
      if(!property)throw new Error('Este imóvel não foi encontrado. Confira se o link está correto.');
      render(property);
    })
    .catch(error=>showError(error.message||'Tente novamente mais tarde.'));
})();
</script>
</body>
</html>
